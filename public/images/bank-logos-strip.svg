<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" fill="none">
  <!-- Lending Partners Strip -->
  <!-- HDFC Bank -->
  <g transform="translate(10, 15)">
    <rect width="110" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="12" y="14" width="22" height="22" fill="#004C8F"/>
    <rect x="18" y="20" width="10" height="10" fill="#ED232A"/>
    <text x="40" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#004C8F">HDFC BANK</text>
  </g>

  <!-- ICICI Bank -->
  <g transform="translate(135, 15)">
    <rect width="115" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="25" cy="25" r="12" fill="#F37021"/>
    <text x="44" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#992B15">ICICI BANK</text>
  </g>

  <!-- Axis Bank -->
  <g transform="translate(265, 15)">
    <rect width="110" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <polygon points="25,14 15,36 35,36" fill="#97144D"/>
    <text x="42" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#97144D">AXIS BANK</text>
  </g>

  <!-- IDFC FIRST Bank -->
  <g transform="translate(390, 15)">
    <rect width="135" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="12" y="16" width="18" height="18" fill="#9D2235"/>
    <text x="36" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#9D2235">IDFC FIRST Bank</text>
  </g>

  <!-- Kotak Mahindra -->
  <g transform="translate(540, 15)">
    <rect width="130" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="26" cy="25" r="11" fill="#ED1C24"/>
    <text x="44" y="32" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#003366">Kotak Bank</text>
  </g>

  <!-- Bajaj Finserv -->
  <g transform="translate(685, 15)">
    <rect width="135" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="25" cy="25" r="11" fill="#0072BC"/>
    <text x="42" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#0072BC">BAJAJ FINSERV</text>
  </g>

  <!-- Tata Capital -->
  <g transform="translate(835, 15)">
    <rect width="130" height="50" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <polygon points="25,15 15,35 35,35" fill="#0B529B"/>
    <text x="42" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#0B529B">TATA CAPITAL</text>
  </g>
</svg>
