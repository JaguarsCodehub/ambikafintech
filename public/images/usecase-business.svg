<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" fill="none">
  <!-- Business Working Capital Illustration -->
  <rect width="380" height="200" rx="16" fill="#1E293B"/>
  <circle cx="320" cy="40" r="80" fill="#334155" opacity="0.4"/>
  <g transform="translate(30, 30)">
    <!-- Shop / Factory & Growth Chart -->
    <rect x="10" y="50" width="80" height="80" rx="8" fill="#F25C05"/>
    <polygon points="50,20 0,55 100,55" fill="#C2410C"/>
    <rect x="35" y="85" width="30" height="45" rx="4" fill="#FFFFFF"/>
    <rect x="20" y="65" width="18" height="18" rx="3" fill="#FED7AA"/>
    <rect x="62" y="65" width="18" height="18" rx="3" fill="#FED7AA"/>
    <!-- Growth Graph -->
    <path d="M120 120 L170 80 L220 95 L280 40" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
    <circle cx="280" cy="40" r="7" fill="#10B981"/>
    <!-- Arrow Head -->
    <polygon points="275,30 295,35 285,50" fill="#10B981"/>
    <!-- Rupee symbol floating -->
    <circle cx="200" cy="45" r="16" fill="#FBBF24"/>
    <text x="194" y="52" font-size="16" font-weight="900" fill="#78350F">₹</text>
  </g>
  <text x="30" y="175" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FED7AA">Working Capital &amp; Inventory Surge</text>
</svg>
