<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" fill="none">
  <!-- Debt Consolidation / Credit Card Payoff Illustration -->
  <rect width="380" height="200" rx="16" fill="#1E293B"/>
  <circle cx="280" cy="50" r="70" fill="#334155" opacity="0.3"/>
  <g transform="translate(35, 25)">
    <!-- Credit Cards being replaced by Low-Interest Car Loan -->
    <!-- High Interest Card (Red) -->
    <rect x="10" y="30" width="110" height="65" rx="8" fill="#EF4444" transform="rotate(-8 10 30)"/>
    <text x="25" y="70" font-family="-apple-system, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" transform="rotate(-8 25 70)">36% - 42% APR</text>
    <!-- Scissors / Slash -->
    <line x1="0" y1="20" x2="130" y2="105" stroke="#FBBF24" stroke-width="4" stroke-dasharray="6 4"/>
    <!-- Ambika Smart Loan Badge (Emerald Green / Orange) -->
    <g transform="translate(130, 40)">
      <rect width="170" height="75" rx="12" fill="#FFFFFF" stroke="#FED7AA" stroke-width="2"/>
      <circle cx="30" cy="38" r="16" fill="#FFF7ED"/>
      <text x="24" y="44" font-size="16" font-weight="900" fill="#F25C05">₹</text>
      <text x="56" y="32" font-family="-apple-system, sans-serif" font-size="10" font-weight="800" fill="#64748B">CONSOLIDATED TO</text>
      <text x="56" y="52" font-family="-apple-system, sans-serif" font-size="18" font-weight="900" fill="#10B981">10.99% p.a.</text>
      <text x="56" y="66" font-family="-apple-system, sans-serif" font-size="9" font-weight="700" fill="#F25C05">Save up to ₹2.5L in interest</text>
    </g>
  </g>
  <text x="35" y="175" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FED7AA">Slash Expensive EMI Burdens Instantly</text>
</svg>
