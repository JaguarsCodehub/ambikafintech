  <text x="65" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1.5">LOAN AGAINST CAR • REFINANCING</text>
